services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa
    ports:
      - '5432:5432'
    volumes:
      - mesa_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ./mesa-api
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      JWT_SECRET: mesa-dev-secret
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis

volumes:
  mesa_pg:
